{% extends 'notes/base.html' %}
{% load socialaccount %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card border-0 shadow-lg p-4" style="width: 100%; max-width: 400px; border-radius: 16px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Connexion</h2>
            <p class="text-muted small">Accédez à votre espace technique</p>
        </div>

        <div class="d-grid gap-2 mb-4">
            <a href="{% provider_login_url 'google' %}" class="btn btn-outline-dark py-2 d-flex align-items-center justify-content-center border-2">
                <i class="bi bi-google me-3"></i> Continuer avec Google
            </a>
            <a href="{% provider_login_url 'github' %}" class="btn btn-dark py-2 d-flex align-items-center justify-content-center">
                <i class="bi bi-github me-3"></i> Continuer avec GitHub
            </a>
        </div>

        <div class="d-flex align-items-center mb-4 text-muted">
            <hr class="flex-grow-1">
            <span class="mx-3 small text-uppercase fw-bold" style="font-size: 0.7rem;">Ou</span>
            <hr class="flex-grow-1">
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-bold">Nom d'utilisateur</label>
                <input type="text" name="username" class="form-control" placeholder="Username">
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold">Mot de passe</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Se connecter</button>
        </form>
    </div>
</div>
{% endblock %}
