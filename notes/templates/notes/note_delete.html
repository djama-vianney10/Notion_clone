<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supprimer une Note</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <h1 class="text-center text-danger">🗑 Supprimer la Note</h1>

    <div class="card p-4 shadow">
        <p class="fs-5">Es-tu sûr de vouloir supprimer <strong>{{ note.title }}</strong> ?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Oui, Supprimer</button>
            <a href="{% url 'note_list' %}" class="btn btn-secondary">⬅ Annuler</a>
        </form>
    </div>

</body>
</html>
