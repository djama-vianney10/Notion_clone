{% extends 'notes/base.html' %}

{% block title %}Ajouter/Modifier une Note{% endblock %}

{% block content %}
<h1 class="text-center mb-4">
    {% if form.instance.pk %}Modifier{% else %}Ajouter{% endif %} une Note
</h1>

<div class="card p-4 shadow">
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Titre</label>
            {{ form.title }}
        </div>
        <div class="mb-3">
            <label class="form-label">Contenu</label>
            {{ form.content }}
        </div>
        <div class="mb-3">
            <label class="form-label">Tags</label>
            <div class="tag-list">
                {{ form.tags }}
            </div>
        </div>
        <style>
            .tag-list {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
                margin-top: 10px;
            }

            .tag-list ul {
                list-style: none;
                padding: 0;
                margin: 0;
            }

            .tag-list li {
                margin-bottom: 0;
            }

            .tag-list label {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 8px 12px;
                background-color: #fff;
                border: 2px solid #0d6efd;
                border-radius: 50px;
                cursor: pointer;
                font-weight: 500;
                color: #0d6efd;
                transition: all 0.2s ease;
                box-shadow: 0 2px 6px rgba(13, 110, 253, 0.07);
            }

            .tag-list label:hover {
                background-color: #e7f1ff;
                border-color: #0a58ca;
            }

            .tag-list input[type="checkbox"] {
                accent-color: #0d6efd;
                margin-right: 8px;
                width: 18px;
                height: 18px;
            }

            .tag-list input[type="checkbox"]:checked+label {
                background-color: #0d6efd;
                color: #fff;
                border-color: #0d6efd;
            }
        </style>
        <div class="mb-3">
            <label class="form-label">Statut</label>
            {{ form.resultat }}
        </div>
        <button type="submit" class="btn btn-success">✅ Enregistrer</button>
        <a href="{% url 'note_list' %}" class="btn btn-secondary">⬅ Retour</a>
    </form>
</div>
{% endblock %}
